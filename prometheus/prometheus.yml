global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "dgx_collector"
    metrics_path: /metrics
    # The custom collector is lightweight and fast; 15s is plenty.
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["dgx-collector:9273"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]