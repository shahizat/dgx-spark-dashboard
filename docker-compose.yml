services:
  dgx-collector:
    # Handwritten custom collector for the DGX Spark (GB10) unified-memory
    # architecture. Replaces both nvidia-gpu-exporter and node-exporter:
    # it parses /proc/meminfo + nvidia-smi and serves Prometheus metrics
    # directly on :9273/metrics. No textfile, no node-exporter involved.
    image: python:3.12-slim
    container_name: dgx-collector
    restart: unless-stopped
    environment:
      DGX_EXPORTER_PORT: "9273"
      COLLECT_INTERVAL: "10"
      # GPU version + host identity are discovered from the host OS at runtime
      # (see collector/dgx_collector.py + the /etc/hostname & CUDA version.json
      # mounts below). These env vars are optional fallbacks only, so the same
      # compose file works on any host (Jetson Thor, DGX Spark, ...).
      DGX_DRIVER_VERSION: ""
      DGX_CUDA_VERSION: ""
      DGX_HOST_NAME: ""
      # NVIDIA_DRIVER_CAPABILITIES tells the toolkit which driver libraries to
      # inject. Gets combined with the device plugin reservation below.
      NVIDIA_DRIVER_CAPABILITIES: utility
    volumes:
      - ./collector/dgx_collector.py:/opt/dgx_collector.py:ro
      - /proc/meminfo:/proc/meminfo:ro
      # Host CPU + memory sources the collector reads for the CPU & RAM panels
      # (/proc/stat delta for utilization, loadavg, cpuinfo dump for model/cores).
      # meminfo above covers RAM; these three cover the CPU telemetry.
      - /proc/stat:/proc/stat:ro
      - /proc/loadavg:/proc/loadavg:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # Host OS sources the collector derives driver/CUDA version + hostname
      # from, so no version/host literals are baked into the config. CUDA
      # layout differs by host (version.json vs version.txt, /usr/local/cuda
      # vs /usr/local/cuda-<ver>), so mount several likely candidates.
      - /etc/hostname:/etc/hostname:ro
      - /usr/local/cuda/version.json:/usr/local/cuda/version.json:ro
      - /usr/local/cuda/version.txt:/usr/local/cuda/version.txt:ro
      - /usr/local/cuda-12/version.json:/usr/local/cuda-12/version.json:ro
      - /usr/local/cuda-13/version.json:/usr/local/cuda-13/version.json:ro
    command: ["/usr/local/bin/python3", "/opt/dgx_collector.py"]
    ports:
      - "9273:9273"
    pid: host
    ipc: private
    # GPU is exposed via the modern NVIDIA device plugin
    # (`deploy.resources.devices` + `capabilities: [gpu]`), which the
    # nvidia-container-toolkit supports on both DGX Spark and Jetson hosts.
    # (The legacy `runtime: nvidia` path is NOT used — the DGX Spark's default
    # Docker runtime is plain `runc`, so it would fail to start there.)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
    name: dgx-gpu-monitoring_prometheus-data
  grafana-data:
    name: dgx-gpu-monitoring_grafana-data